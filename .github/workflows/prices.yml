name: prices
on:
  schedule:
    - cron: '0,30 13-21 * * 1-5'   # 平日 13:00〜21:30 UTC の30分毎（EDT/EST両対応）
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: globe-prices
  cancel-in-progress: true
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Update prices
        run: python main.py prices
      - name: Commit prices
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/prices.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: update prices $(date -u +%Y-%m-%dT%H:%MZ)"
          # dashboard ワークフローと push が衝突しても取りこぼさないよう取り込んでから push
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "push retry $i"; sleep $((i * 10))
          done
          echo "::error::push failed after 5 retries"; exit 1
