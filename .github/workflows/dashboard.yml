name: dashboard
on:
  schedule:
    - cron: '30 21 * * *'      # 毎日 21:30 UTC（米国引け後）
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: globe-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build dashboard
        run: python main.py report
      - name: Commit docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: update dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
          # 生成に約10分かかる間に prices ワークフローが push していることがあるため、
          # 取り込んでから push する（競合は docs/prices.json のみ＝こちらの新しい方を採用）。
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "push retry $i"; sleep $((i * 10))
          done
          echo "::error::push failed after 5 retries"; exit 1
